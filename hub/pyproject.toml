[project]
name = "exuviae-hub"
version = "0.1.0"
description = "Exuviae Hub"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tzdata"
]

[project.optional-dependencies]
test = [
    "requests>=2.32.0",
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: cross-process / slow smoke tests (normally run manually)",
  "contract: contract/SSOT consistency checks",
]
addopts = [
  "--strict-markers",
]