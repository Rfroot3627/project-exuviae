[project]
name = "exuviae-node"
version = "0.1.0"
description = "Node for project-exuviae"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "websockets>=12.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
